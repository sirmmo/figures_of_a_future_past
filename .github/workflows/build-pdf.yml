name: Build PDFs

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build all game documents
        # Each .tex in the repo root is a standalone article document.
        # example.tex is the rpgtex template demo and is skipped — keep it
        # in the repo only as reference.
        #
        # We use lualatex (not pdflatex) because the sources contain
        # Unicode glyphs the source files don't declare via inputenc
        # mappings (e.g. ≤). LuaTeX accepts UTF-8 natively.
        run: |
          set -eux
          mkdir -p out
          for src in \
            global_master.tex \
            federation.tex halcyon.tex ionclad.tex thalassar.tex \
            federation_chars.tex halcyon_char.tex ironclad_char.tex
          do
            echo "::group::compile $src"
            # Two passes: tcolorbox/fancyhdr settle on the second.
            lualatex -interaction=nonstopmode -halt-on-error "$src"
            lualatex -interaction=nonstopmode -halt-on-error "$src"
            cp "${src%.tex}.pdf" "out/${src%.tex}.pdf"
            echo "::endgroup::"
          done

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: figures-of-a-future-past-pdfs
          path: out/*.pdf
          if-no-files-found: error

      - name: Attach PDFs to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.pdf

      - name: Publish to itch.io
        if: github.event_name == 'release'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends curl unzip
          curl -sSL -o /tmp/butler.zip \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o /tmp/butler.zip -d /usr/local/bin
          chmod +x /usr/local/bin/butler
          butler -V
          # 8 channels, one per document. The master sheet + 4 faction
          # panels + 3 character-sheet bundles each get their own slot.
          butler push out/global_master.pdf     sirmmo/figures-of-a-future-past:master       --userversion "$TAG"
          butler push out/federation.pdf        sirmmo/figures-of-a-future-past:federation   --userversion "$TAG"
          butler push out/halcyon.pdf           sirmmo/figures-of-a-future-past:halcyon      --userversion "$TAG"
          butler push out/ionclad.pdf           sirmmo/figures-of-a-future-past:ionclad      --userversion "$TAG"
          butler push out/thalassar.pdf         sirmmo/figures-of-a-future-past:thalassar    --userversion "$TAG"
          butler push out/federation_chars.pdf  sirmmo/figures-of-a-future-past:chars-federation --userversion "$TAG"
          butler push out/halcyon_char.pdf      sirmmo/figures-of-a-future-past:chars-halcyon    --userversion "$TAG"
          butler push out/ironclad_char.pdf     sirmmo/figures-of-a-future-past:chars-ironclad   --userversion "$TAG"
